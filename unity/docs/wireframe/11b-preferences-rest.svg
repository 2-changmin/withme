<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>익숙한 모습 · 쉬는 모습</title><desc>곁에 앱 모바일 와이어프레임. 추억 앨범 제외. 검토용 SVG이며 실제 앱 화면이 아닙니다.</desc><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.25px}svg{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="390" height="844" rx="24" fill="#FCFDF9" stroke="#D6DDD7" /><text x="25" y="29" font-size="12" fill="#273C35" font-weight="600" text-anchor="start">9:41</text><path d="M326 20h5v7h-5zM334 17h5v10h-5zM342 14h5v13h-5z" fill="#273C35" /><rect x="354" y="15" width="17" height="10" rx="2" fill="none" stroke="#273C35" /><text x="52" y="74" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">익숙한 모습</text><path d="M163 827h64" stroke="#273C35" stroke-width="4" stroke-linecap="round" /><a href="11-preferences.svg" aria-label="이전 질문으로"><text x="24" y="76" font-size="28" fill="#273C35" font-weight="600" text-anchor="start">‹</text></a><text x="24" y="123" font-size="12" fill="#496A59" font-weight="500" text-anchor="start">익숙한 모습 · 2 / 4</text><rect x="24" y="139" width="78" height="4" rx="2" fill="#496A59" stroke="none" /><rect x="112" y="139" width="78" height="4" rx="2" fill="#496A59" stroke="none" /><rect x="200" y="139" width="78" height="4" rx="2" fill="#D6DDD7" stroke="none" /><rect x="288" y="139" width="78" height="4" rx="2" fill="#D6DDD7" stroke="none" /><text x="24" y="215" font-size="22" fill="#273C35" font-weight="650" text-anchor="start">쉴 때 어떤 자세를 좋아했나요?</text><text x="24" y="249" font-size="13" fill="#718078" font-weight="400" text-anchor="start">기억에 가까운 모습을 하나 골라 주세요.</text><g role="radio" aria-checked="true" aria-label="앉아서 쉬었어요"><rect x="24" y="311" width="342" height="78" rx="16" fill="#F0F3ED" stroke="#496A59" /><circle cx="52" cy="350" r="10" fill="white" stroke="#496A59" stroke-width="1.5" /><circle cx="52" cy="350" r="5" fill="#496A59" /><text x="78" y="356" font-size="16" fill="#273C35" font-w