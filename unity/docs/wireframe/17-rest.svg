<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>잠시 쉬어가기</title><desc>곁에 앱 모바일 와이어프레임. 추억 앨범 제외. 검토용 SVG이며 실제 앱 화면이 아닙니다.</desc><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.25px}svg{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="390" height="844" rx="24" fill="#FCFDF9" stroke="#D6DDD7"/><text x="25" y="29" font-size="12" fill="#273C35" font-weight="600" text-anchor="start">9:41</text><path d="M326 20h5v7h-5zM334 17h5v10h-5zM342 14h5v13h-5z" fill="#273C35"/><rect x="354" y="15" width="17" height="10" rx="2" fill="none" stroke="#273C35"/><text x="24" y="76" font-size="20" fill="#273C35" font-weight="600" text-anchor="start">곁에</text><text x="195" y="74" font-size="14" fill="#273C35" font-weight="500" text-anchor="middle">잠시 쉬어가기</text><path d="M163 827h64" stroke="#273C35" stroke-width="4" stroke-linecap="round"/><rect x="24" y="136" width="70" height="25" rx="12" fill="#F0F3ED" stroke="none"/><text x="59" y="153" font-size="11" fill="#496A59" font-weight="500" text-anchor="middle">PAUSE</text><text x="24" y="221" font-size="26" fill="#273C35" font-weight="650" text-anchor="start">잠시 쉬어가도 괜찮아요</text><text x="24" y="264" font-size="14" fill="#718078" font-weight="400" text-anchor="start">움직임과 소리를 잠시 멈췄어요.</text><text x="24" y="287" font-size="14" fill="#718078" font-weight="400" text-anchor="start">준비가 되면 다시 돌아올 수 있어요.</text><path d="M138 445Q160 386 194 407Q228 381 251 445Q211 467 194 502Q174 468 138 445Z" fill="#F0F3ED" stroke="#D6DDD7"/><rect x="24" y="665" width="342" height="50" rx="14" fill="white" stroke="#D6DDD7"/><text x="195" y="696" font-size="15" fill="#273C35" font-weight="600" text-anchor="middle">사진 보기</text><rect x="24" y="731" width="342" height="50" rx="14" fill="white" stroke="#D6DDD7"/><text x="195" y="762" font-size="15" fill="#273C35" font-weight="600" text-anchor="middle">함께하기로 돌아가기</text><text x="195" y="799" font-size="11" fill="#718078" font-weight="400" text-anchor="middle">원할 때 다시 돌아오세요.</text></svg>