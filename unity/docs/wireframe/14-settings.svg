<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>통합 메뉴</title><desc>3D 메인에서 메뉴 버튼으로 진입하는 통합 메뉴. 사진·이용 제어·강아지 정보·계정 관리.</desc><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.25px}svg{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="390" height="844" rx="24" fill="#FCFDF9" stroke="#D6DDD7" /><text x="25" y="29" font-size="12" fill="#273C35" font-weight="600" text-anchor="start">9:41</text><path d="M326 20h5v7h-5zM334 17h5v10h-5zM342 14h5v13h-5z" fill="#273C35" /><rect x="354" y="15" width="17" height="10" rx="2" fill="none" stroke="#273C35" /><path d="M163 827h64" stroke="#273C35" stroke-width="4" stroke-linecap="round" /><text x="24" y="87" font-size="27" fill="#273C35" font-weight="650" text-anchor="start">메뉴</text><a href="12-together.svg" aria-label="메뉴 닫고 3D 메인으로"><rect x="318" y="53" width="48" height="48" rx="14" fill="white" stroke="#D6DDD7" /><text x="342" y="83" font-size="12" fill="#496A59" font-weight="500" text-anchor="middle">닫기</text></a><text x="24" y="128" font-size="20" fill="#273C35" font-weight="600" text-anchor="start">보리</text><text x="24" y="154" font-size="11" fill="#718078" font-weight="400" text-anchor="start">사진을 바탕으로 AI가 표현한 모습이에요.</text><text x="24" y="195" font-size="12" fill="#718078" font-weight="600" text-anchor="start">편안하게 이용하기</text><g><text x="24" y="235" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">소리 끄기</text><path d="M24 251H366" stroke="#D6DDD7" /><rect x="320" y="217" width="43" height="25" rx="13" fill="#496A59" stroke="none" /><circle cx="350" cy="229.5" r="9" fill="white" /></g><g><text x="24" y="282" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">동작 줄이기</text><path d="M24 298H366" stroke="#D6DDD7" /><rect x="320" y="264" width="43" height="25" rx="13" fill="#D6DDD7" stroke="none" /><circle cx="333" cy="276.5" r="9" fill="white" /></g><a href="13-photo-mode.svg" aria-label="사진 보기"><text x="24" y="329" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">사진 보기</text><text x="356" y="329" font-size="14" fill="#718078" font-weight="400" text-anchor="end">›</text><path d="M24 345H366" stroke="#D6DDD7" /></a><a href="17-rest.svg" aria-label="즉시 나가기"><text x="24" y="376" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">즉시 나가기</text><text x="356" y="376" font-size="14" fill="#718078" font-weight="400" text-anchor="end">›</text><path d="M24 392H366" stroke="#D6DDD7" /></a><text x="24" y="429" font-size="12" fill="#718078" font-weight="600" text-anchor="start">보리의 이야기</text><a href="03-profile.svg" aria-label="이름·사진"><text x="24" y="468" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">이름·사진</text><text x="356" y="468" font-size="14" fill="#718078" font-weight="400" text-anchor="end">›</text><path d="M24 484H366" stroke="#D6DDD7" /></a><a href="11-preferences.svg" aria-label="익숙한 모습"><text x="24" y="515" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">익숙한 모습</text><text x="356" y="515" font-size="14" fill="#718078" font-weight="400" text-anchor="end">›</text><path d="M24 531H366" stroke="#D6DDD7" /></a><a href="15-sounds.svg" aria-label="기억 속 소리"><text x="24" y="562" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">기억 속 소리</text><text x="356" y="562" font-size="14" fill="#718078" font-weight="400" text-anchor="end">›</text><path d="M24 578H366" stroke="#D6DDD7" /></a><a href="09-walk-preview.svg" aria-label="모습·움직임 다시 보기"><text x="24" y="609" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">모습·움직임 다시 보기</text><text x="356" y="609" font-size="14" fill="#718078" font-weight="400" text-anchor="end">›</text><path d="M24 625H366" stroke="#D6DDD7" /></a><text x="24" y="659" font-size="12" fill="#718078" font-weight="600" text-anchor="start">계정과 안내</text><g><text x="24" y="698" font-size="14" fill="#273C35" font-weight="500" text-anchor="st