<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>이메일 인증</title><desc>곁에 앱 모바일 와이어프레임. 추억 앨범 제외. 검토용 SVG이며 실제 앱 화면이 아닙니다.</desc><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.25px}svg{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="390" height="844" rx="24" fill="#FCFDF9" stroke="#D6DDD7"/><text x="25" y="29" font-size="12" fill="#273C35" font-weight="600" text-anchor="start">9:41</text><path d="M326 20h5v7h-5zM334 17h5v10h-5zM342 14h5v13h-5z" fill="#273C35"/><rect x="354" y="15" width="17" height="10" rx="2" fill="none" stroke="#273C35"/><text x="24" y="76" font-size="28" fill="#273C35" font-weight="600" text-anchor="start">‹</text><text x="52" y="74" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">이메일 인증</text><path d="M163 827h64" stroke="#273C35" stroke-width="4" stroke-linecap="round"/><text x="24" y="163" font-size="26" fill="#273C35" font-weight="650" text-anchor="start">이메일을 확인해 주세요</text><text x="24" y="202" font-size="14" fill="#718078" font-weight="400" text-anchor="start">name@example.com으로 보낸</text><text x="24" y="225" font-size="14" fill="#718078" font-weight="400" text-anchor="start">6자리 인증 코드를 입력해 주세요.</text><rect x="24" y="278" width="51" height="62" rx="10" fill="white" stroke="#496A59"/><text x="49" y="317" font-size="23" fill="#273C35" font-weight="500" text-anchor="middle">•</text><rect x="82" y="278" width="51" height="62" rx="10" fill="white" stroke="#D6DDD7"/><text x="107" y="317" font-size="23" fill="#273C35" font-weight="500" text-anchor="middle">•</text><rect x="140" y="278" width="51" height="62" rx="10" fill="white" stroke="#D6DDD7"/><text x="165" y="317" font-size="23" fill="#273C35" font-weight="500" text-anchor="middle">•</text><rect x="198" y="278" width="51" height="62" rx="10" fill="white" stroke="#D6DDD7"/><text x="223" y="317" font-size="23" fill="#273C35" font-weight="500" text-anchor="middle"></text><rect x="256" y="278" width="51" height="62" rx="10" fill="white" stroke="#D6DDD7"/><text x="281" y="317" font-size="23" fill="#273C35" font-weight="500" text-anchor="middle"></text><rect x="314" y="278" width="51" height="62" rx="10" fill="white" stroke="#D6DDD7"/><text x="339" y="317" font-size="23" fill="#273C35" font-weight="500" text-anchor="middle"></text><text x="24" y="370" font-size="12" fill="#9A5949" font-weight="400" text-anchor="start">코드가 올바르지 않아요. 다시 확인해 주세요.</text><text x="195" y="427" font-size="13" fill="#496A59" font-weight="500" text-anchor="middle">코드 다시 받기</text><rect x="24" y="688" width="342" height="50" rx="14" fill="#496A59" stroke="#496A59"/><text x="195" y="719" font-size="15" fill="white" font-weight="600" text-anchor="middle">인증하고 시작하기</text><text x="195" y="767" font-size="13" fill="#496A59" font-weight="500" text-anchor="middle">이메일 주소 바꾸기</text></svg>