<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>제작 상태</title><desc>곁에 앱 모바일 와이어프레임. 추억 앨범 제외. 검토용 SVG이며 실제 앱 화면이 아닙니다.</desc><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.25px}svg{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="390" height="844" rx="24" fill="#FCFDF9" stroke="#D6DDD7"/><text x="25" y="29" font-size="12" fill="#273C35" font-weight="600" text-anchor="start">9:41</text><path d="M326 20h5v7h-5zM334 17h5v10h-5zM342 14h5v13h-5z" fill="#273C35"/><rect x="354" y="15" width="17" height="10" rx="2" fill="none" stroke="#273C35"/><text x="24" y="76" font-size="28" fill="#273C35" font-weight="600" text-anchor="start">‹</text><text x="52" y="74" font-size="14" fill="#273C35" font-weight="500" text-anchor="start">잠시 기다려 주세요</text><path d="M163 827h64" stroke="#273C35" stroke-width="4" stroke-linecap="round"/><rect x="24" y="125" width="120" height="25" rx="12" fill="#F0F3ED" stroke="none"/><text x="84" y="142" font-size="11" fill="#496A59" font-weight="500" text-anchor="middle">잠시 쉬어가는 중</text><text x="24" y="191" font-size="26" fill="#273C35" font-weight="650" text-anchor="start">아직 모습을 찾지 못했어요</text><text x="24" y="231" font-size="13" fill="#718078" font-weight="400" text-anchor="start">올려주신 사진은 그대로 있어요.</text><text x="24" y="254" font-size="13" fill="#718078" font-weight="400" text-anchor="start">사진을 보거나 나중에 다시 찾아볼 수 있어요.</text><rect x="24" y="293" width="342" height="195" rx="12" fill="#F0F3ED" stroke="#D6DDD7"/><path d="M36 473L133.44 406.1L195 441.2L266.82 382.7L354 473" fill="#DDE5D9" stroke="none"/><circle cx="116.34" cy="347.6" r="13.650000000000002" fill="#CAD6C6"/><rect x="34" y="303" width="90" height="25" rx="12" fill="#F0F3ED" stroke="none"/><text x="79" y="320" font-size="11" fill="#496A59" font-weight="500" text-anchor="middle">원본 사진</text><rect x="24" y="518" width="342" height="70" rx="12" fill="#F0F3ED" stroke="none"/><text x="38" y="543" font-size="12" fill="#718078" font-weight="400" text-anchor="start">보리를 만날 준비가 아직 끝나지 않았어요.</text><text x="38" y="565" font-size="12" fill="#718078" font-weight="400" text-anchor="start">준비 상태를 확인하고 이어서 안내해 드릴게요.</text><rect x="24" y="674" width="342" height="50" rx="14" fill="#496A59" stroke="#496A59"/><text x="195" y="705" font-size="15" fill="white" font-weight="600" text-anchor="middle">사진 모드로 이용</text><rect x="24" y="734" width="342" height="50" rx="14" fill="white" stroke="#D6DDD7"/><text x="195" y="765" font-size="15" fill="#273C35" font-weight="600" text-anchor="middle">준비 상태 확인하기</text><text x="195" y="805" font-size="11" fill="#718078" font-weight="400" text-anchor="middle">문제가 계속되면 설정의 문의로 알려 주세요.</text></svg>