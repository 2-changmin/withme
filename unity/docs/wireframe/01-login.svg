<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>시작하기</title><desc>곁에 앱 모바일 와이어프레임. 추억 앨범 제외. 검토용 SVG이며 실제 앱 화면이 아닙니다.</desc><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.25px}svg{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="390" height="844" rx="24" fill="#FCFDF9" stroke="#D6DDD7"/><text x="25" y="29" font-size="12" fill="#273C35" font-weight="600" text-anchor="start">9:41</text><path d="M326 20h5v7h-5zM334 17h5v10h-5zM342 14h5v13h-5z" fill="#273C35"/><rect x="354" y="15" width="17" height="10" rx="2" fill="none" stroke="#273C35"/><text x="24" y="76" font-size="20" fill="#273C35" font-weight="600" text-anchor="start">곁에</text><text x="195" y="74" font-size="14" fill="#273C35" font-weight="500" text-anchor="middle">시작하기</text><path d="M163 827h64" stroke="#273C35" stroke-width="4" stroke-linecap="round"/><rect x="24" y="123" width="111" height="25" rx="12" fill="#F0F3ED" stroke="none"/><text x="79.5" y="140" font-size="11" fill="#496A59" font-weight="500" text-anchor="middle">PRIVATE SPACE</text><text x="24" y="202" font-size="30" fill="#273C35" font-weight="650" text-anchor="start">기억을 꺼내는</text><text x="24" y="243" font-size="30" fill="#273C35" font-weight="650" text-anchor="start">우리만의 작은 공간</text><text x="24" y="284" font-size="15" fill="#718078" font-weight="400" text-anchor="start">사진 속 우리 아이를 만나고,</text><text x="24" y="307" font-size="15" fill="#718078" font-weight="400" text-anchor="start">원할 때 조용히 함께해요.</text><rect x="24" y="333" width="342" height="167" rx="12" fill="#F0F3ED" stroke="#D6DDD7"/><path d="M36 485L133.44 429.86L195 459.92L266.82 409.82L354 485" fill="#DDE5D9" stroke="none"/><circle cx="116.34" cy="379.76" r="11.690000000000001" fill="#CAD6C6"/><rect x="34" y="343" width="90" height="25" rx="12" fill="#F0F3ED" stroke="none"/><text x="79" y="360" font-size="11" fill="#496A59" font-weight="500" text-anchor="middle">사진과 기억</text><text x="24" y="539" font-size="12" fill="#718078" font-weight="500" text-anchor="start">이메일 주소</text><rect x="24" y="551" width="342" height="52" rx="12" fill="white" stroke="#D6DDD7"/><text x="40" y="583" font-size="15" fill="#273C35" font-weight="400" text-anchor="start">name@example.com</text><rect x="24" y="650" width="342" height="50" rx="14" fill="#496A59" stroke="#496A59"/><text x="195" y="681" font-size="15" fill="white" font-weight="600" text-anchor="middle">인증 코드 받기</text><text x="24" y="737" font-size="12" fill="#718078" font-weight="400" text-anchor="start">이메일로 받은 코드를 입력하면 시작할 수 있어요.</text><text x="24" y="760" font-size="12" fill="#718078" font-weight="400" text-anchor="start">사진을 바탕으로 AI가 표현한 모습이에요.</text></svg>